<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Государственный архив Восточно-Казахстанской области: электронный каталог, цифровая история региона, онлайн-выставки." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1b2e57" />
    <title>Шығыс Қазақстан облысының мемлекеттік мұрағаты</title>
    <script>
      // Применяет версию для слабовидящих, паузу анимации и язык до первой отрисовки, чтобы не было вспышки.
      // Логика повторяет src/lib/a11y-prefs.ts (applyPrefs); их совпадение проверяет tests/a11y-prefs.test.ts.
      (function () {
        var root = document.documentElement;
        var p = {};
        try { p = JSON.parse(localStorage.getItem('archive-vko:a11y') || '{}') || {}; } catch (e) { p = {}; }
        var on = p.mode === true;
        root.classList.toggle('a11y', on);
        root.classList.toggle('a11y-xl', on && p.size === 'xl');
        root.classList.toggle('a11y-wb', on && p.scheme === 'wb');
        root.classList.toggle('a11y-blue', on && p.scheme === 'blue');
        root.classList.remove('a11y-noimg');
        root.classList.toggle('txt-l', !on && p.text === 'l');
        root.classList.toggle('txt-xl', !on && p.text === 'xl');
        root.classList.toggle('no-motion', p.still === true);
        root.dataset.theme = 'light';
        root.dataset.contrast = on ? 'high' : 'normal';
        root.dataset.motion = on || p.still === true ? 'reduce' : 'full';
        var m = location.pathname.match(/^\/(kk|ru|en)(\/|$)/);
        if (m) root.lang = m[1];
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы сайта включите JavaScript. / Сайт жұмыс істеуі үшін JavaScript қосыңыз. / Please enable JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
